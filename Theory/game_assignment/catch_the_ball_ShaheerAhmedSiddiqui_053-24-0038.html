
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch the Ball Game</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #gameArea {
            width: 400px;
            height: 400px;
            border: 2px solid black;
            margin: 20px auto;
            position: relative;
            overflow: hidden;
            background-color: #f2f2f2;
        }

        .ball {
            width: 40px;
            height: 40px;
            background-color: red;
            border-radius: 50%;
            position: absolute;
            cursor: pointer;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Catch the Ball</h1>

    <h3>Score: <span id="score">0</span></h3>
    <h3>Time: <span id="time">20</span> seconds</h3>

    <div id="gameArea"></div>

    <h2 id="message">Click Start to play!</h2>

    <button id="startBtn" onclick="startGame()">Start Game</button>

    <script>
        let score = 0;
        let time = 20;
        let gameRunning = false;
        let ball;
        let ballTimer;
        let gameTimer;

        const gameArea = document.getElementById("gameArea");
        const scoreText = document.getElementById("score");
        const timeText = document.getElementById("time");
        const message = document.getElementById("message");
        const startBtn = document.getElementById("startBtn");

        function createBall() {
            if (!gameRunning) {
                return;
            }

            ball = document.createElement("div");
            ball.className = "ball";

            //random position of ball
            ball.style.left = Math.random() * 350 + "px";
            ball.style.top = "0px";

            gameArea.appendChild(ball);

            ball.onclick = function () {
                if (!gameRunning) {
                    return;
                }

                score = score + 10;
                scoreText.textContent = score;

                ball.remove();

                clearInterval(ballTimer);

                // Create another ball
                createBall();
            };

            let position = 0;

            ballTimer = setInterval(function () {
                if (!gameRunning) {
                    return;
                }

                position = position + 5;
                ball.style.top = position + "px";

                if (position >= 360) {
                    score = score - 5;
                    scoreText.textContent = score;

                    // Delete the missed ball
                    ball.remove();

                    clearInterval(ballTimer);

                    // Create another ball
                    createBall();
                }
            }, 100);
        }

        function startGame() {
            clearInterval(ballTimer);
            clearInterval(gameTimer);

            gameArea.innerHTML = "";

            score = 0;
            time = 20;
            gameRunning = true;

            scoreText.textContent = score;
            timeText.textContent = time;
            message.textContent = "Catch the ball!";
            startBtn.disabled = true;

            createBall();

            gameTimer = setInterval(function () {
                time--;
                timeText.textContent = time;

                if (time <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            gameRunning = false;

            clearInterval(ballTimer);
            clearInterval(gameTimer);

            gameArea.innerHTML = "";

            message.textContent = "Game Over! Final Score: " + score;
            startBtn.disabled = false;
            startBtn.textContent = "Restart Game";
        }
    </script>

</body>
</html>
