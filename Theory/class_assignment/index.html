<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment</title>
</head>
<style>
    body{
        padding: 0;
        margin: 0;
    }
    .main{
        width: 500px;
        height: 500px;
        background-color:bisque;
        display: flex;
        flex-wrap: wrap;
    }
    .circle{
        width: 100px;
        height: 100px;
        border-radius: 50%;
        justify-content: center;
        align-items: center;
        text-align: center;
        display: flex;
        background-color: blue;
        color: white;
    }
</style>
<script>
    let counter = 2;
    function addNode(){
        let main = document.getElementById("mainArea");
        let node = document.createElement("div");
        node.classList.add("circle");
         let nodeText = document.createTextNode(counter);

        node.appendChild(nodeText);
        main.appendChild(node);
        counter++;


        node.addEventListener(event, remove());
    }

    function removeNode(event, target){
        this.event.remove();
    }
</script>
<body>
        <div class="main" id="mainArea">
            <div class="circle">1</div>
        </div>
        <div class="footer">
            <button onclick="addNode()">click</button>
        </div>
</body>
</html>
